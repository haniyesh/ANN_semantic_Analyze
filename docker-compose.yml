# ── Crypto News Analyzer — full stack ─────────────────────────────────────────
#
# Usage:
#   cp .env.example .env          # fill in secrets
#   docker compose up -d          # start all services
#   docker compose logs -f api    # follow API logs
#   docker compose down -v        # tear down + remove volumes
#
# Services:
#   postgres   — PostgreSQL 16, data persisted in a named volume
#   api        — FastAPI server (port 8000), serves dashboard + WebSocket
#   bot        — Telegram listener + scoring pipeline
#   dashboard  — Vite/React frontend (port 5173, dev mode)
# ─────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-cryptonews}
      POSTGRES_USER:     ${POSTGRES_USER:-cryptouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cryptouser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cryptonews}
      HF_HOME: /app/model_cache
    volumes:
      - ./storage:/app/storage          # news_cache.json lives here
      - model_cache:/app/model_cache    # HuggingFace model weights
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  bot:
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cryptouser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cryptonews}
      DASHBOARD_API: http://api:8000
      HF_HOME: /app/model_cache
      TELEGRAM_SESSION: /app/session/telegram_session
    volumes:
      - ./storage:/app/storage
      - model_cache:/app/model_cache
      # Telegram session file must persist across restarts
      - telegram_session:/app/session
    command: python main.py

  dashboard:
    build:
      context: ./dashboard2
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  model_cache:
  telegram_session:
